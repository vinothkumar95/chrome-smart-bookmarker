<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Clipboard Collections</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header class="app-header">
      <h1>
        <svg class="icon" viewBox="0 0 24 24">
          <path d="M19,3H14.82C14.4,1.84 13.3,1 12,1C10.7,1 9.6,1.84 9.18,3H5A2,2 0 0,0 3,5V19A2,2 0 0,0 5,21H19A2,2 0 0,0 21,19V5A2,2 0 0,0 19,3M12,3A1,1 0 0,1 13,4A1,1 0 0,1 12,5A1,1 0 0,1 11,4A1,1 0 0,1 12,3M7,7H17V5H19V19H5V5H7V7Z" />
        </svg>
        Clipboard Collections
      </h1>
      <div class="collection-selector">
        <select id="collections" class="collection-dropdown"></select>
        <button id="create-collection" class="icon-button" title="New Collection">
          <svg viewBox="0 0 24 24">
            <path d="M19,13H13V19H11V13H5V11H11V5H13V11H19V13Z" />
          </svg>
        </button>
      </div>
    </header>

    <div class="content">
      <div class="items-list" id="text-list"></div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
